# WHY: Delay installs of newly published packages for 48 hours to reduce
# exposure to compromised releases before the ecosystem has time to react.
minimumReleaseAge: 2880

overrides:
  browserslist: 4.28.7
  brace-expansion@<2.0.0: 1.1.21
  brace-expansion@>=2.0.0 <3.0.0: 2.1.7
  handlebars: 4.7.10
  js-yaml: 4.3.2
  # WHY: GHSA-g3hv-75wg-m249 has no patched release before v11.
  minimatch@>=7.0.0 <11.0.1: 11.0.1

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lefthook: false
  unrs-resolver: false

